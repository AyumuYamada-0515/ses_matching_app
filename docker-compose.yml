services:
  app:
    image: serversideup/php:8.4-fpm-nginx
    ports: ["8080:8080"]
    environment:
      PHP_OPCACHE_ENABLE: 0
    volumes: [".:/var/www/html"]
    depends_on: [mysql]
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ses_match
      MYSQL_USER: ses_match
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
volumes:
  mysql-data:
